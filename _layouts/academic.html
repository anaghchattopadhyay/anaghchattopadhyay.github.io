<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="Anagh Chattopadhyay">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:image" content="{{ '/assets/img/profile.jpg' | absolute_url }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="google-site-verification" content="oAwkIlhb5W-PwT0kRHK0xYKlRKSwKIxqVQp6DFP3lnk">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/img/profile.jpg' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Source+Sans+3:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="{{ '/' | relative_url }}">Anagh Chattopadhyay</a>
      <nav>
        <a href="{{ '/#about' | relative_url }}">About</a>
        <a href="{{ '/#news' | relative_url }}">News</a>
        <a href="{{ '/#publications' | relative_url }}">Publications</a>
        <a href="{{ '/#talks' | relative_url }}">Talks</a>
        <a href="{{ '/CV.pdf' | relative_url }}">CV</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="wrap footer">
    <p>&copy; {{ site.time | date: '%Y' }} Anagh Chattopadhyay &middot; Last updated {{ site.time | date: '%B %Y' }}</p>
  </footer>
</body>
</html>
